# Zero-infrastructure default: fake embedder + in-memory store.
# Runs with only requirements.txt installed — no GPU, no Qdrant, no downloads.
# Real-backbone configs (siglip2 + qdrant) come in Sprint 2.

name: default-fake-inmemory

retriever:
  type: dense
  name: fake-inmemory
  embedder:
    type: fake
    params:
      dim: 64
  store:
    type: inmemory
    params: {}

